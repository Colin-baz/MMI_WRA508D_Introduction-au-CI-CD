name: Symfony CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          extensions: mbstring, xml, curl, zip, bcmath, intl
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHP lint
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Audit de sécurité
        run: composer audit --format=json --no-interaction
        continue-on-error: true # Permettre au CI de continuer même si des vulnérabilités sont détectées

      - name: Dump environment variables for production
        run: composer dump-env prod
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Compile assets
        run: php bin/console asset-map:compile

      - name: Create artifact archive
        run: |
          tar -czvf symfony-artifact.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=var/cache \
            --exclude=var/log \
            --exclude=tests \
            --exclude=.env \
            --exclude=docker \
            --exclude=docker-compose.yml \
            --exclude=README.md \
            --exclude=*.log \
            --exclude=*.gitignore \
            .

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v3
        with:
          name: symfony-artifact
          path: symfony-artifact.tar.gz
